[project]
name = "sleep-analysis"
version = "0.1.0"
description = "DATA3800: does working alongside studies affect students' sleep? (NHIS 2024)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.5",
    "matplotlib>=3.11",
    "seaborn>=0.13",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    "statsmodels>=0.15",
    "jupyter>=1.1",      # notebooks in VS Code or JupyterLab, and nbconvert to run them all
    "truststore>=0.10",  # fixes certificate errors when downloading on school networks
]

# Installs `src` into .venv, so `from src.data import ...` works in every notebook
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
